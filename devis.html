/* ── APP HEADER ── */

/* ── AIRTABLE BANNER ── */
.at-banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.15);white-space:nowrap}

.ri{width:72px;text-align:right;font-size:13px;border:0.5px solid rgba(13,27,42,.15);border-radius:6px;padding:5px 8px;font-family:'DM Sans',sans-serif}

.rtbtn{background:none;border:0.5px solid rgba(13,27,42,.2);border-radius:5px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--sgray);font-family:'DM Sans',sans-serif}

.btn-legal-edit{font-size:11px;color:var(--sgray);background:none;border:0.5px solid rgba(13,27,42,.15);border-radius:4px;padding:3px 9px;cursor:pointer;font-family:'DM Sans',sans-serif}

.legal-txt{font-size:12px;color:var(--sgray);line-height:1.65;margin-bottom:3px}
.legal-ta{width:100%;font-size:12px;font-family:'DM Sans',sans-serif;border:0.5px solid var(--gold);border-radius:6px;padding:8px;color:var(--navy);outline:none;resize:vertical;min-height:90px;line-height:1.6;background:rgba(201,169,110,.04)}

<script>

const AT_BASE=`https://api.airtable.com/v0/${BASE_ID}`;
const AT_HDR={'Authorization':`Bearer ${AT_TOKEN}`,'Content-Type':'application/json'};

async function atGet(table,recordId){
  const r=await fetch(`${AT_BASE}/${table}/${recordId}`,{headers:AT_HDR});
  if(!r.ok)throw new Error(`Airtable ${r.status}`);
  return(await r.json()).fields;
}
async function atPatch(table,recordId,fields,typecast=false){
  const body=typecast?{fields,typecast:true}:{fields};
  const r=await fetch(`${AT_BASE}/${table}/${recordId}`,{
    method:'PATCH',headers:AT_HDR,body:JSON.stringify(body)
  });
  if(!r.ok){
    let msg=`Airtable ${r.status}`;
    try{const e=await r.json();msg+=` – ${e.error?.message||JSON.stringify(e)}`;}catch{}
    throw new Error(msg);
  }
  return await r.json();
}
async function atFind(table,formula){
  const url=`${AT_BASE}/${table}?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`;
  const r=await fetch(url,{headers:AT_HDR});
  if(!r.ok)throw new Error(`Airtable ${r.status}`);
  const d=await r.json();
  return d.records&&d.records[0]?d.records[0]:null;
}
async function atFetchAll(table){
  let records=[],offset=null;
  do{
    let url=`${AT_BASE}/${table}`;
    if(offset)url+=`?offset=${encodeURIComponent(offset)}`;
    const r=await fetch(url,{headers:AT_HDR});
    if(!r.ok){let msg=`Airtable ${r.status}`;try{const e=await r.json();msg+=` – ${e.error?.message||JSON.stringify(e)}`;}catch{}throw new Error(msg);}
    const d=await r.json();
    records=records.concat(d.records||[]);
    offset=d.offset||null;
  }while(offset);
  return records;
}

function buildCatalogue(rubRecs,presRecs){
  const mKey={n:'Mode_Nouveau',r:'Mode_Remontage',s:'Mode_Stockage',m:'Mode_Mobilier'};
  CAT_TR={};SEC_TR={};
  rubRecs.forEach(rec=>{const f=rec.fields;if(f.Nom_FR&&f.Nom_EN)SEC_TR[f.Nom_FR]=f.Nom_EN;});
  presRecs.forEach(rec=>{const f=rec.fields;if(f.Nom_FR&&f.Nom_EN)CAT_TR[f.Nom_FR]=f.Nom_EN;});
  SC=[];
  rubRecs.forEach(rubRec=>{
    const rf=rubRec.fields,rubId=rubRec.id;
    const typeRendu=rf.Type_Rendu||'Standard';
    const _modes={
      n:rf.Mode_Nouveau||'Optionnel',
      r:rf.Mode_Remontage||'Optionnel',
      s:rf.Mode_Stockage||'Masqué',
      m:rf.Mode_Mobilier||'Masqué'
    };
    const myPres=presRecs.filter(p=>{
      const lnk=p.fields.RUBRIQUES_Prestation;
      return lnk&&(Array.isArray(lnk)?lnk.includes(rubId):lnk===rubId);
    }).sort((a,b)=>(a.fields.Ordre||0)-(b.fields.Ordre||0));
    let groups=[],defs=[];
    if(typeRendu==='Phases'){
      const grpMap=new Map();
      myPres.forEach(p=>{
        const pf=p.fields,gn=pf.Groupe||0;
        if(!grpMap.has(gn))grpMap.set(gn,{lbl:pf.Groupe_Label_FR||`Phase ${gn}`,cats:[]});
        grpMap.get(gn).cats.push(pf.Nom_FR);
      });
      const sortedKeys=[...grpMap.keys()].sort((a,b)=>a-b);
      groups=sortedKeys.map(k=>grpMap.get(k));
      myPres.forEach(p=>{
        const pf=p.fields;
        if((pf[mKey[st.type]]||'Optionnel')==='Défaut'){
          const gi=sortedKeys.indexOf(pf.Groupe||0);
          defs.push({cat:pf.Nom_FR,g:gi>=0?gi:0});
        }
      });
    }else{
      groups=[{lbl:null,cats:myPres.map(p=>p.fields.Nom_FR)}];
      myPres.forEach(p=>{
        const pf=p.fields;
        if((pf[mKey[st.type]]||'Optionnel')==='Défaut'){
          const isSto=pf.Special==='Stockage'||pf.Nom_FR==='Frais de stockage';
          defs.push({cat:pf.Nom_FR,g:0,...(isSto?{isStorage:true}:{})});
        }
      });
    }
    const sc={name:rf.Nom_FR,_rubRecId:rubId,_modes,groups,defs};
    if(typeRendu==='Phases')sc.hasPhases=true;
    if(typeRendu==='Lignes')sc.perLine=true;
    SC.push(sc);
  });
  DEFS_IDX=SC.reduce((acc,sec,idx)=>{
    if(sec._modes[st.type]==='Défaut')acc.push(idx);
    return acc;
  },[]);
}

/* Recharge client + événement + projet depuis Airtable — appelé à chaque load brouillon */
function parseCGVText(raw){
  if(!raw)return'';
  const lines=raw.split('\n').map(l=>l.trim()).filter(l=>l.length>2);
  if(!lines.length)return'';
  let html='',i=0;
  // Sauter le préambule jusqu'au premier article
  while(i<lines.length&&!/^Article\s+\d+/i.test(lines[i]))i++;
  if(i>=lines.length){
    // Aucune structure Article trouvée : rendu brut en paragraphes
    return lines.map(l=>`<p class="lp">${esc(l)}</p>`).join('');
  }
  while(i<lines.length){
    if(/^Article\s+\d+/i.test(lines[i])){
      const title=lines[i++];
      const body=[];
      while(i<lines.length&&!/^Article\s+\d+/i.test(lines[i]))body.push(lines[i++]);
      html+=`<div class="cgv-art"><div class="cgv-art-title">${esc(title)}</div>`
           +`<div class="cgv-art-body">${body.filter(l=>l.length>3).map(p=>`<p class="lp">${esc(p)}</p>`).join('')}</div></div>`;
    }else{
      const ft=lines.slice(i).filter(l=>l.length>3).join(' ');
      if(ft)html+=`<div class="cgv-footer">${esc(ft)}</div>`;
      break;
    }
  }
  return html;
}

        console.log('[loadDocuments] CGV',lang,'text=',CGV[lang].length,'chars, pdf=',CGV_PDF[lang]||'none');
      }else{
        console.log('[loadDocuments] no CGV record for lang=',lang,'— available Langue values:',cgvRecs.map(r=>r.fields.Langue));
      }
    });
  }catch(e){console.warn('[loadDocuments] échec:',e.message);}
}
async function imgToBase64(url){
  try{
    const resp=await fetch(url);
    const blob=await resp.blob();
    return await new Promise(resolve=>{const r=new FileReader();r.onloadend=()=>resolve(r.result);r.readAsDataURL(blob);});
  }catch(e){return'';}
}
async function atLoadLinked(devis){
  if(devis.CLIENT_Nom&&devis.CLIENT_Nom.length){
    const clientRecId=Array.isArray(devis.CLIENT_Nom)?devis.CLIENT_Nom[0]:devis.CLIENT_Nom;
    if(clientRecId.startsWith('rec')){
      const cf=await atGet(TBL_CLIENT,clientRecId);
      st.ctx.cliSociete=cf.Nom||'';
      st.ctx.cliContact=cf.Contact_Nom_Complet||cf.Contact_Nom||'';
      st.ctx.cliEmail=cf.Contact_Email||'';
      st.ctx.cliAdresse=cf.Adresse||'';
      st.ctx.cliTVA=cf.Numero_TVA||'';
      st.ctx._atClientId=clientRecId;
      if(cf.Logo&&cf.Logo.length){
        try{
          const entry=cf.Logo[0];
          const url=(entry.thumbnails&&entry.thumbnails.large)?entry.thumbnails.large.url:entry.url;
          st.ctx.cliLogoBase64=await imgToBase64(url);
        }catch(e){st.ctx.cliLogoBase64='';console.warn('[logo]',e.message);}
      }
    }
  }
  let projRecId=null;
  /* lien direct Devis → Projet (champ "Projet" = linked record vers table Projets) */
  if(devis.Projet&&devis.Projet.length){
    const pid=Array.isArray(devis.Projet)?devis.Projet[0]:devis.Projet;
    if(typeof pid==='string'&&pid.startsWith('rec'))projRecId=pid;
  }
  if(devis.EVENEMENT&&devis.EVENEMENT.length){
    const evtRecId=Array.isArray(devis.EVENEMENT)?devis.EVENEMENT[0]:devis.EVENEMENT;
    if(evtRecId.startsWith('rec')){
      const ef=await atGet(TBL_EVNT,evtRecId);
      st.ctx.salonNom=devis.Evenement?String(devis.Evenement):(ef.Fx_Nom||'');
      const d1=ef.Date_Debut?new Date(ef.Date_Debut).toLocaleDateString('fr-FR'):null;
      const d2=ef.Date_Fin?new Date(ef.Date_Fin).toLocaleDateString('fr-FR'):null;
      st.ctx.salonDates=d1&&d2?`${d1} – ${d2}`:d1||'';
      st.ctx._atEvtId=evtRecId;
      /* lien Evenement → Projet (fallback si pas de lien direct sur le devis) */
      if(!projRecId&&ef.Projet&&ef.Projet.length){
        const pid=Array.isArray(ef.Projet)?ef.Projet[0]:ef.Projet;
        if(typeof pid==='string'&&pid.startsWith('rec'))projRecId=pid;
      }
      if(ef.Adresse){
        st.ctx.salonLieu=ef.Adresse;
      } else if(ef.Salon&&ef.Salon.length){
        const salonRecId=Array.isArray(ef.Salon)?ef.Salon[0]:ef.Salon;
        if(salonRecId.startsWith('rec')){
          const sf=await atGet(TBL_SALON,salonRecId);
          st.ctx.salonLieu=sf.Adresse||'';
        }
      }
    }
  }
  if(!st.ctx.salonNom&&devis.Evenement)st.ctx.salonNom=String(devis.Evenement);
  /* Coût fournisseur HT depuis la table Projet */
  if(projRecId){
    try{
      const pf=await atGet(TBL_PROJET,projRecId);
      if(pf['Fx_Coût_Fournisseur_HT']!=null)st.ctx.coutFournisseurHT=String(pf['Fx_Coût_Fournisseur_HT']);
      st.ctx._atProjetId=projRecId;
    }catch(e){console.warn('[atLoadLinked] projet:',e.message);}
  }
}

/* Chargement depuis Airtable via ?id=recXXX */
async function atLoad(recordId){
  showBanner('loading',t('atLoading'));
  try{
    const devis=await atGet(TBL_DEVIS,recordId);

    /* ── Bloc JSON : si Devis_JSON existe, les sections viennent EXCLUSIVEMENT du JSON ── */
    if(devis.Devis_JSON){
      let restoreOk=false;
      try{
        /* Décode le format : '%7B...' = URL-encodé (nouveau), '{...' = JSON brut (ancien/corrompu) */
        const raw=devis.Devis_JSON;
        let jsonStr=(raw.charAt(0)==='{' || raw.charAt(0)==='[') ? raw : decodeURIComponent(raw);
        let saved;
        try{
          saved=JSON.parse(jsonStr);
        }catch(e1){
          /* Tentative de réparation : Airtable (rich text activé) supprimait un niveau
             de backslash, laissant des séquences \X invalides. On les retire. */
          console.warn('[atLoad] Parse échoué ('+e1.message+'), tentative réparation…');
          const repaired=jsonStr.replace(/\\([^"\\\/bfnrtu])/g,'$1');
          saved=JSON.parse(repaired);
          console.warn('[atLoad] JSON réparé avec succès');
        }
        restoreState(saved);
        /* buildCatalogue intentionnellement absent : sections depuis le JSON uniquement. */
        st.ctx._atRecordId=recordId;
        st._atMode=true;
        /* Statut toujours depuis Airtable (pas du JSON — peut avoir changé hors UI) */
        st.status=(devis.Statut||'Brouillon').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
        if(devis['Créé par']&&devis['Créé par'].name)st.ctx._createdBy=devis['Créé par'].name;
        /* En brouillon : refresh systématique des champs Airtable (client, événement, num, dates).
           Statuts figés (envoyé, expiré, accepté, refusé, annulé) : JSON seul — aucune donnée Airtable
           ne vient écraser la dernière version sauvegardée. */
        if(st.status==='brouillon'){
          st.ctx.dateEmission=todayStr();
          if(devis.Fx_Numero)st.ctx.num=devis.Fx_Numero;
          /* Date_Expiration calculée dynamiquement — non chargée depuis Airtable */
          await atLoadLinked(devis);
        }
        console.log('[atLoad] JSON restauré →',st.sections.length,'rubriques (catalogue ignoré)');
        restoreOk=true;
      }catch(e){
        /* JSON illisible même après réparation : log détaillé, pas de bascule catalogue. */
        console.error('[atLoad] Échec parse/restore :',e);
        try{console.error('[atLoad] Devis_JSON (200 car.) :',String(devis.Devis_JSON).substring(0,200));}catch{}
        showBanner('error','Erreur lecture JSON – '+e.message);
      }
      /* render() hors du try : erreur de rendu remontée par le catch externe, pas confondue avec erreur JSON. */
      if(restoreOk)showBanner('success',t('atLoaded'));
      render();
      return;
    }
    console.log('[atLoad] Aucun JSON → rubriques par défaut du catalogue');

    /* Sinon initialise depuis les champs Airtable (première création — pas de JSON) */
    st.ctx._atRecordId=recordId;
    st._atMode=true;
    st.status=(devis.Statut||'Brouillon').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(devis['Créé par']&&devis['Créé par'].name)st.ctx._createdBy=devis['Créé par'].name;

    /* Champs toujours rechargés depuis Airtable */
    st.ctx.dateEmission=todayStr();
    if(devis.Fx_Numero)st.ctx.num=devis.Fx_Numero;
    /* Date_Expiration calculée dynamiquement — non chargée depuis Airtable */
    await atLoadLinked(devis);

    /* Champs de première création : éditables et synchronisés sur save */
    if(devis['Surface_(m2)'])st.ctx.salonSurface=String(devis['Surface_(m2)']);
    if(devis.Validite_Jours)st.ctx.validite=String(devis.Validite_Jours);
    const rawRegime=devis.Regime_TVA||'';
    if(rawRegime){
      const rmap={'UE (autoliquidation)':'eu','UE (TVA)':'eu_ht','Hors UE (hors champ)':'export','Export hors UE':'export','France (TVA)':'fr','France (franchise TVA)':'fr_na'};
      st.tvaMode=rmap[rawRegime]||'fr';
    }
    st.ctx.cliNature=st.tvaMode;
    /* Valeurs par défaut création */
    st.acp='70';
    st.remise='0';

    /* Applique le type depuis le champ Airtable "Type" (nouveau devis sans JSON) */
    const rawT=(devis.Type||'').toString()
      .toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    const tMap={
      'stand (nouveau)':'n','stand (remontage)':'r',
      'stockage':'s','mobilier':'m',
      n:'n',r:'r',s:'s',m:'m'
    };
    if(tMap[rawT])st.type=tMap[rawT];
    buildCatalogue(_rubRecords,_presRecords);
    st.sections=DEFS_IDX.map((ci,i)=>mkSec(ci,i));
    nSid=DEFS_IDX.length;

    showBanner('success',t('atLoaded'));
    render();
    /* Sauvegarde immédiate (await) : garantit que Devis_JSON est écrit dans Airtable
       avant tout rechargement de page. scheduleSave (debounce 2 s) ne suffisait pas
       car un rafraîchissement rapide annule le timer et laisse Devis_JSON à null. */
    await atSave();
  }catch(err){
    showBanner('error',t('atError')+err.message);
    render();
  }
}

/* Sauvegarde vers Airtable (debounce) */
let _saveTimer=null;
/* Déverrouillage soft (statut envoyé/expiré) — remis à false à chaque render forcé */
let _unlocked=false;
function scheduleSave(){
  if(!st._atMode||!st.ctx._atRecordId)return;
  const readonly=st.status==='accepte'||st.status==='refuse'||st.status==='annule';
  if(readonly)return;
  clearTimeout(_saveTimer);
  setSavingDot(true);
  _saveTimer=setTimeout(()=>atSave(),2000);
}
async function atSave(){
  if(!st.ctx._atRecordId){console.warn('[atSave] ignoré – _atRecordId null');return;}
  showBanner('saving',t('atSaving'));
  try{
    const{ht,rmt,ap,ttc,acompte,solde}=calc();
    const statMap={brouillon:'Brouillon',envoye:'Envoyé',accepte:'Accepté',refuse:'Refusé',expire:'Expiré',annule:'Annulé'};
    let expiryDate='';
    try{const d=new Date(st.ctx.dateEmission);d.setDate(d.getDate()+(parseInt(st.ctx.validite)||7));expiryDate=d.toISOString().split('T')[0];}catch{}
    const devisJSON=encodeURIComponent(JSON.stringify(st));
    /* safeFields : purement numériques / texte / date — ne peut jamais provoquer de 422 */
    const safeFields={
      'Devis_JSON':devisJSON,
      'Montant_HT':Math.round(ht*100)/100,
      'Remise_HT':Math.round(rmt*100)/100,
      'Total_HT':Math.round(ap*100)/100,
      'Total_TTC':Math.round(ttc*100)/100,
      'Acompte_Total':Math.round(acompte*100)/100,
      'Solde_Total':Math.round(solde*100)/100,
      'Validite_Jours':parseInt(st.ctx.validite)||7,
      'Frais_Gestion':!!st.fraisGestion,
      ...(st.ctx.dateEmission?{'Date_Emission':st.ctx.dateEmission}:{}),
      ...(expiryDate?{'Date_Expiration':expiryDate}:{})
    };
    /* softFields : champs single-select — envoyés avec typecast:true pour forcer la création de l'option */
    const tvaMap={'fr':'France (TVA)','fr_na':'France (franchise TVA)','eu':'UE (autoliquidation)','eu_ht':'UE (TVA)','export':'Hors UE (hors champ)'};
    const softFields={
      'Statut':statMap[st.status]||'Brouillon',
      'Langue':st.lang,
      'Regime_TVA':tvaMap[st.tvaMode]||st.tvaMode,
      ...(st.ctx.salonSurface&&st.type!=='s'&&st.type!=='m'?{'Surface_(m2)':parseFloat(st.ctx.salonSurface)}:{})
    };
    /* Essai 1 : champs sûrs — ne peut jamais échouer en 422 */
    await atPatch(TBL_DEVIS,st.ctx._atRecordId,safeFields);
    console.log('[atSave] PATCH safeFields OK');
    /* Essai 2 : single-selects avec typecast (crée l'option si absent et autorisé) */
    atPatch(TBL_DEVIS,st.ctx._atRecordId,softFields,true).then(()=>{
      console.log('[atSave] PATCH softFields OK');
    }).catch(e=>{
      console.warn('[atSave] softFields partiellement ignorés :',e.message);
    });
    st.savedAt=new Date().toISOString();
    showBanner('success',t('atSaved'));
    setSavingDot(false);
    render();
  }catch(err){
    console.error('[atSave] échec :',err.message);
    /* 422 = option single-select manquante dans Airtable — silencieux pour l'utilisateur */
    if(!err.message.includes('422'))showBanner('error',t('atError')+err.message);
    setSavingDot(false);
  }
}

/* ═══ UTILS ═══ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmt(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u00a0€';}
function effName(l){return l.custom?(l.ctxt||'Prestation'):(l.cat?dc(l.cat):'');}
function lineAmt(l){
  if(l.lineOff)return 0;
  if(l.storageType)return(parseFloat(l.qty)||0)*(parseFloat(l.uprice)||0);
  return parseFloat(l.lineHt)||0;
}
function calc(){
  const ht=st.sections.reduce((s,sec)=>{
    if(sec.phases)return s+sec.phases.reduce((p,ph)=>p+(ph.off?0:(parseFloat(ph.ht)||0)),0);
    if(sec.perLine)return s+sec.lines.reduce((p,l)=>p+lineAmt(l),0);
    return s+(sec.off?0:(parseFloat(sec.ht)||0));
  },0);
  const r=parseFloat(st.remise)||0;
  const rmt=st.rt==='%'?ht*r/100:Math.min(r,ht);
  const ap=Math.max(0,ht-rmt);
  const isFR=st.tvaMode==='fr'||st.tvaMode==='eu_ht';
  const tva=isFR?ap*0.2:0;
  const ttc=isFR?ap*1.2:ap;
  const pct=Math.max(0,Math.min(100,parseFloat(st.acp)||0));
  return{ht,rmt,ap,tva,ttc,acompte:ttc*pct/100,solde:ttc*(1-pct/100)};
}
function getLegal(){
  if(!st.legal[st.lang])st.legal[st.lang]=JSON.parse(JSON.stringify(LEGAL_DEF[st.lang]||LEGAL_DEF.fr));
  return st.legal[st.lang];
}
function legalTxt(key){
  const lg=getLegal();
  const stored=lg[key]!=null?lg[key]:((LEGAL_DEF[st.lang]||LEGAL_DEF.fr)[key]||'');
  if(st.type==='s'&&(key==='nonInclus'||key==='conditions')){
    const stkDef=(LEGAL_DEF_STOCKAGE.fr||{})[key]||'';
    const genDef=(LEGAL_DEF[st.lang]||LEGAL_DEF.fr)[key]||'';
    /* Use stockage default unless user has customised away from generic default */
    if(!stored||stored===genDef)return stkDef;
  }
  return stored;
}
function updT(){
  const{ht,rmt,ap,tva,ttc,acompte,solde}=calc();
  const hr=(parseFloat(st.remise)||0)>0;
  const g=id=>document.getElementById(id);
  const sv=(id,v)=>{const e=g(id);if(e)e.textContent=v;};
  const sh=(id,vis)=>{const e=g(id);if(e)e.style.display=vis?'':'none';};
  sv('vht-s',fmt(ht));sv('vht-av',fmt(ht));
  sh('row-ht-s',!hr);sh('row-ht-av',hr);sh('row-ht-ap',hr);
  sv('vap',fmt(ap));sv('vrmt','− '+fmt(rmt));
  if(st.tvaMode==='fr'||st.tvaMode==='eu_ht'){sv('vtva',fmt(tva));sv('vttc',fmt(ttc));}
  sv('vacp',fmt(acompte));sv('vsol',fmt(solde));
  scheduleSave();
}

  for(const g of groups){

    o+=gl?`<optgroup label="${esc(gl)}">${opts}</optgroup>`:opts;

function phAmt(sid,ci,gi,ph){
  const scCfg=ci>=0&&ci<SC.length?SC[ci]:null;
  const lbl=scCfg&&scCfg.groups[gi]?ds(scCfg.groups[gi].lbl):ds(`Phase ${gi+1}`);
  return`<div class="sar-ph">
    <span style="font-size:12px;color:var(--sgray);font-weight:500">${t('mHT')} ${lbl}\u00a0:</span>
    <label class="off-chk"><input type="checkbox" ${ph.off?'checked':''} onchange="togPhOff(${sid},${gi})"> ${t('offert')}</label>
    ${ph.off?`<span class="offbadge">${t('offBadge')}</span>`:''}
    <input type="number" class="amt" value="${esc(ph.ht)}" placeholder="0,00" min="0" step="0.01" style="${ph.off?'opacity:0.35;':''}" oninput="uPhHT(${sid},${gi},this.value)">
    <span style="font-size:13px;color:var(--sgray)">€ HT</span>
  </div>`;
}
function phLines(s){
  const ci=s.ci>=0&&s.ci<SC.length?s.ci:0;
  const scCfg=SC[ci];
  const numGroups=scCfg?scCfg.groups.length:2;
  let h='';
  for(let gi=0;gi<numGroups;gi++){
    const lbl=scCfg&&scCfg.groups[gi]?ds(scCfg.groups[gi].lbl):ds(`Phase ${gi+1}`);
    h+=`<div class="phase-lbl${gi===0?' first':''}">${lbl}</div>`;
    h+=s.lines.filter(l=>(l.g||0)===gi).map(l=>lHTML(ci,s.id,l,false)).join('');
    h+=`<button class="badd" onclick="aLineTo(${s.id},${gi})">+ ${st.lang==='en'?`Add – ${lbl}`:`Ajouter en ${lbl}`}</button>`;
    h+=phAmt(s.id,ci,gi,s.phases[gi]);
  }
  return h;
}
function secBody(s){
  if(s.phases)return phLines(s);
  if(s.perLine){
    const tot=s.lines.reduce((x,l)=>x+lineAmt(l),0);
    return s.lines.map(l=>lHTML(s.ci,s.id,l,true)).join('')
      +`<button class="badd" onclick="aLinePerLine(${s.id})">+ ${t('addPrest')}</button>`
      +`<div class="sar"><span style="font-size:13px;color:var(--sgray)">${t('stoTot')}</span><strong style="font-size:14px">${fmt(tot)}</strong></div>`;
  }
  return s.lines.map(l=>lHTML(s.ci,s.id,l,false)).join('')
    +`<button class="badd" onclick="aLine(${s.id})">+ ${t('addPrest')}</button>`
    +`<div class="sar">
        <span style="font-size:13px;color:var(--sgray)">${t('mHT')}\u00a0:</span>
        <label class="off-chk"><input type="checkbox" ${s.off?'checked':''} onchange="togOff(${s.id})"> ${t('offert')}</label>
        ${s.off?`<span class="offbadge">${t('offBadge')}</span>`:''}
        <input type="number" class="amt" value="${esc(s.ht)}" placeholder="0,00" min="0" step="0.01" style="${s.off?'opacity:0.35;':''}" oninput="uHT(${s.id},this.value)">
        <span style="font-size:13px;color:var(--sgray)">€ HT</span>
      </div>`;
}
function cRight(s){
  if(s.phases){const tot=s.phases.reduce((x,ph)=>x+(ph.off?0:(parseFloat(ph.ht)||0)),0);if(s.phases.every(ph=>ph.off))return`<span class="sh-offbadge">${t('offBadge')}</span>`;if(tot>0)return`<span class="sh-amt">${fmt(tot)}</span>`;return`<span class="sh-amt" style="opacity:.35">—</span>`;}
  if(s.perLine){const tot=s.lines.reduce((x,l)=>x+lineAmt(l),0);return tot>0?`<span class="sh-amt">${fmt(tot)}</span>`:`<span class="sh-amt" style="opacity:.35">—</span>`;}
  const v=parseFloat(s.ht)||0;
  if(s.off)return`<span class="sh-offbadge">${t('offBadge')}</span>${v>0?`<span class="sh-amt" style="opacity:.5;text-decoration:line-through;margin-right:4px">${fmt(v)}</span>`:''}`;

}

  const marge=ap-cout;
  const pct=cout>0?Math.round((marge/cout)*100*10)/10:null;
  const pctTxt=pct!==null?(pct>0?'+':'')+pct.toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+' %':'—';
  return`<div class="marge-block np">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:13px;font-weight:600;color:#065f46">${st.lang==='en'?'Estimated gross margin':'Marge brute prévisionnelle'}</span>
      <span style="font-size:14px;font-weight:700;color:${pct!==null&&pct<0?'#dc2626':'#065f46'}">${pctTxt}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
      <span style="font-size:11px;font-style:italic;color:#6b7280">${st.lang==='en'?'Based on supplier quotes entered':'sur base des devis fournisseurs renseignés'}</span>
      <span style="font-size:12px;color:#374151">${fmt(cout)}</span>
    </div>
  </div>`;
}
function render(){
  const readonly=st.status==='accepte'||st.status==='refuse'||st.status==='annule';
  const softLocked=!readonly&&!_unlocked&&(st.status==='envoye'||st.status==='expire');
  const frozenUI=readonly||softLocked;
  const cgvPh=`<div class="cgv-ph"><strong style="font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--navy)">${t('cgvTitle')}</strong><br>${t('cgvPh')}</div>`;

    +st.sections.map((s,i)=>secHTML(s,i)).join('')
    +(frozenUI?'':addSelHTML())
    +(st.fraisGestion?fraisGestionSectionHTML(frozenUI):'')
    +totHTML()
    +margeBruteHTML()
    +(st.fraisGestion?legalBlock('fraisGestion','fraisGestionTitle'):'')
    +legalBlock('nonInclus','nonInclusTitle')
    +legalBlock('conditions','condTitle')
    +legalBlock('propriete','propTitle')
    +cgvPh;

  document.getElementById('app').innerHTML=
    headerHTML()
    +`<div class="type-vignette"><span class="tv-dot" style="background:${{n:'#C9A96E',r:'#2F80ED',s:'#10B981',m:'#A78BFA'}[st.type]||'#C9A96E'}"></span><span class="tv-lbl">${t('typeDevis')}</span><span class="tv-sep"></span><span class="tv-val">${t('tab'+st.type.toUpperCase())}</span></div>`
    +ctxHTML()
    +body
    +sigBlockHTML()
    +bottomBarHTML();

  if(frozenUI){
    document.querySelectorAll(
      '.ni,.amt,.asmall,.ri,.desc-ta,.legal-ta,.badd,.add-sel,.fg-desc,'+
      '.cinp,.cat-sel,.aper,.rtbtn,.tva-sel,.btn-legal-edit,.del'
    ).forEach(el=>{el.disabled=true;el.style.opacity='.6';el.style.pointerEvents='none';});
    document.querySelectorAll('.off-chk input[type="checkbox"]').forEach(el=>{
      el.disabled=true;el.style.pointerEvents='none';
    });
  }
}

  const inp=document.getElementById('cinp-'+lid);

function uCatReset(sid,lid){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.custom=false;l.cat='';l.confirmed=false;render();}}
function uLineHt(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.lineHt=v;updT();}}
function uLineOff(sid,lid){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.lineOff=!l.lineOff;render();scheduleSave();}}
function uLineQty(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.qty=v;updT();updStoTotal(lid);}}

function uLinePeriod(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.period=v;render();scheduleSave();}}
function uCat(sid,lid,v){
  const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(!l)return;
  if(v==='Autre'){l.custom=true;l.cat='';l.ctxt='';l.confirmed=false;render();setTimeout(()=>{const inp=document.getElementById('cinp-'+lid);if(inp)inp.focus();},30);return;}
  l.custom=false;l.cat=v;l.confirmed=false;
  if(s.perLine){const wasSto=l.storageType;l.storageType=(v==='Frais de stockage');if(l.storageType&&!wasSto){l.desc='payable à terme à échoir';dopen[l.id]=true;}}
  if(s.ci>=0&&SC[s.ci]&&SC[s.ci].hasPhases)for(let gi=0;gi<SC[s.ci].groups.length;gi++){if(SC[s.ci].groups[gi].cats.includes(v)){l.g=gi;break;}}
  render();
}

function uCtx(k,v){
  st.ctx[k]=v;
  if(k==='dateEmission'||k==='validite'){
    const el=document.getElementById('inp-expiry');
    if(el){try{const d=new Date(st.ctx.dateEmission);d.setDate(d.getDate()+(parseInt(st.ctx.validite)||7));el.value=d.toISOString().split('T')[0];}catch{}}
  }
}
function uStatus(v){
  const wasTerminal=st.status==='accepte'||st.status==='refuse'||st.status==='annule';
  const becomesTerminal=v==='accepte'||v==='refuse'||v==='annule';
  if(wasTerminal&&!becomesTerminal){
    if(!confirm(st.lang==='fr'?'Réouvrir ce devis en modification ?':'Reopen this quote for editing?'))return;
  }
  st.status=v;
  /* Sauvegarde immédiate sur changement de statut */
  if(st._atMode&&st.ctx._atRecordId){
    clearTimeout(_saveTimer);
    atSave().then(()=>{
      /* Si accepté → déclenche webhook Make */
      if(v==='accepte'){
        showToast(t('accepteWebhook'));
        triggerMake();
      }
    });
  }
  render();
}

<div class="cgv-art"><div class="cgv-art-title">Article 4 — Exécution des prestations et sous-traitance</div><div class="cgv-art-body"><p class="lp">S4U s'engage à exécuter les prestations commandées avec le soin et le professionnalisme attendus d'un opérateur spécialisé. S4U se réserve le droit de recourir, pour tout ou partie des prestations, fournitures et travaux, à des sous-traitants de son choix, dont elle demeure seul responsable vis-à-vis du Client.</p><p class="lp">Les matériaux et structures livrés par S4U sont conformes à la réglementation en vigueur à la date de l'événement. S4U décline toute responsabilité en cas d'erreur dans les informations techniques transmises par le Client ou l'organisateur, notamment concernant les charges au sol, les réseaux, les hauteurs autorisées ou les contraintes de sécurité propres au lieu. En cas de contestation et si l'intervention d'un organisme agréé est demandée, S4U se réserve, en tant que propriétaire et maître d'œuvre, le choix de l'organisation conformément à la réglementation applicable, à la charge financière du Client.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 5 — Planning, délais et force majeure</div><div class="cgv-art-body"><p class="lp"><strong>5.1 Délais</strong></p><p class="lp">S4U s'engage à assurer la livraison, l'installation et la mise à disposition des matériels, équipements et installations commandés à la date contractuellement prévue, conformément aux stipulations du devis accepté, sous réserve de la parfaite exécution par le Client de ses propres obligations contractuelles ainsi que de l'absence de circonstances indépendantes de la volonté de S4U. Les délais d'exécution sont ceux convenus dans le devis. Ils ne commencent à courir qu'à compter de la réception simultanée du devis signé, de l'encaissement de l'acompte prévu à l'article 7 et de l'ensemble des éléments, informations, validations, documents techniques, plans des espaces, visuels, autorisations et accès nécessaires à la bonne exécution des prestations.</p><p class="lp">Le Client s'engage à transmettre à S4U, dans les délais convenus, l'ensemble des éléments nécessaires à l'exécution du contrat. Toute information incomplète, erronée ou transmise tardivement, ainsi que tout retard imputable au Client, à l'organisateur du salon ou à un tiers intervenant sur le site, entraînera de plein droit un report des délais d'exécution, sans que cela puisse être reproché à S4U. Dans cette hypothèse, S4U pourra également facturer au Client l'ensemble des surcoûts générés, notamment ceux liés à la main-d'œuvre supplémentaire, au transport exceptionnel, aux approvisionnements en urgence, aux frais de stockage, de manutention ou de reprogrammation logistique, sur justification.</p><p class="lp"><strong>5.2 Force majeure</strong></p><p class="lp">S4U ne pourra être tenue responsable en cas de survenance d'un événement de force majeure au sens de l'article 1218 du Code civil empêchant ou rendant excessivement difficile l'exécution totale ou partielle de ses obligations contractuelles. Sont notamment considérés comme tels, sans que cette liste soit limitative : catastrophes naturelles, conditions météorologiques exceptionnelles, incendies, inondations, conflits armés, émeutes, actes de terrorisme, grèves générales ou sectorielles, pandémies ou crises sanitaires reconnues par les autorités compétentes, décisions administratives ou préfectorales entraînant l'annulation, le report ou la suspension de l'événement, défaillance grave d'un fournisseur stratégique, pénurie de matières premières, rupture d'approvisionnement, indisponibilité de transporteurs ou manque de main-d'œuvre spécialisée.</p><p class="lp">S4U informera le Client par écrit dans les meilleurs délais de la survenance d'un tel événement. En cas de suspension temporaire, l'exécution du contrat sera reportée pour une durée équivalente à celle de l'empêchement, sans indemnité de part et d'autre. Si l'empêchement se prolonge ou rend définitivement impossible l'exécution du contrat malgré les diligences raisonnables de S4U, chacune des parties pourra résilier le contrat de plein droit, sans indemnité ni dommages-intérêts. Dans cette hypothèse, les acomptes versés resteront acquis à hauteur des études, prestations, approvisionnements, fabrications, réservations, frais logistiques et engagements déjà réalisés ou irrévocablement engagés par S4U à la date de survenance de l'événement. Le solde éventuellement restant sera restitué au Client.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 6 — Mise à disposition, livraison, garde et restitution</div><div class="cgv-art-body"><p class="lp">Sauf stipulation contraire expresse figurant au devis, l'ensemble des matériaux, structures, mobiliers, équipements et installations fournis par S4U sont mis à disposition du Client dans le cadre d'une location temporaire consentie pour la durée de l'événement concerné et demeurent sa propriété exclusive à tout moment. Cette clause est opposable au Client, à ses créanciers et à tout tiers.</p><p class="lp">Les biens sont réputés livrés, installés et conformes aux spécifications contractuelles, sauf réserves écrites, précises et circonstanciées émises par le Client lors de la réception. À défaut, la livraison est réputée acceptée sans réserve et toute réclamation ultérieure relative à un vice apparent sera irrecevable.</p><p class="lp">Le transfert de garde et de responsabilité intervient dès l'installation sur le lieu d'exécution et jusqu'à la reprise effective par S4U. Pendant cette période, le Client devient gardien des biens au sens de l'article 1242 du Code civil. Le Client doit souscrire, à ses frais, toute assurance couvrant sa responsabilité de locataire-exploitant tant à l'égard du public que du matériel mis à sa disposition. S4U se réserve le droit d'exiger la production de l'attestation d'assurance avant le début de l'événement.</p><p class="lp">Les biens demeurent incessibles, insaisissables à l'égard des tiers, et ne peuvent être déplacés, modifiés, sous-loués, donnés en gage ou incorporés à d'autres éléments sans autorisation écrite préalable de S4U. Lors de la restitution du matériel, le Client est tenu d'être présent ou représenté. À défaut, le constat établi unilatéralement par S4U fait foi. S4U dispose de quarante-huit (48) heures à compter de la reprise pour établir son constat d'état.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 7 — Conditions financières</div><div class="cgv-art-body"><p class="lp"><strong>7.1 Tarifs et facturation</strong></p><p class="lp">Tous les prix figurant dans les devis sont exprimés en euros hors taxes (HT). La TVA applicable est celle en vigueur à la date d'émission de la facture. Les tarifs ne comprennent pas les frais d'inscription aux salons, les taxes de l'organisateur, les branchements électriques ou fluides, ni les frais de stationnement ou de manutention, sauf mention expresse contraire dans le devis. Les factures sont payables comptant. Conformément à l'article L441-10 du Code de commerce, aucun escompte ne sera accordé en cas de paiement anticipé.</p><p class="lp">La prestation est due et facturée dans sa totalité dès lors que le montage a été effectué ou que les éléments ont été mis à disposition, y compris en cas d'absence d'exploitation effective du stand imputable au Client ou à l'organisateur. Tout déplacement supplémentaire est à la charge du Client.</p><p class="lp"><strong>7.2 Acomptes et échéances</strong></p><p class="lp">Un acompte de 70 % est exigible à la confirmation de commande, sauf indication contraire dans le devis. Le solde est dû à la réception des travaux ou au plus tard le premier jour d'ouverture du salon. Des conditions différentes peuvent être convenues par écrit dans le devis. S4U ne procède à l'exécution qu'après encaissement de l'acompte.</p><p class="lp"><strong>7.3 Pénalités de retard</strong></p><p class="lp">Toute facture non réglée à son échéance porte de plein droit, sans mise en demeure, des pénalités de retard au taux de trois (3) fois le taux légal (art. L.441-10 C. com.), ainsi qu'une indemnité forfaitaire de recouvrement de 40 € (art. D.441-5 C. com.).</p><p class="lp"><strong>7.4 Annulation du contrat</strong></p><p class="lp">En cas de défaillance caractérisée du Client, S4U pourra, après mise en demeure restée infructueuse huit (8) jours, suspendre les prestations en cours et/ou reprendre les matériaux loués, aux frais, risques et périls du Client. En cas d'annulation par le Client, les indemnités forfaitaires suivantes sont dues à S4U, sans préjudice de tout dommage complémentaire :</p><p class="lp">— Plus de 60 jours avant le 1er jour de montage : l'acompte versé reste acquis à S4U.</p><p class="lp">— Entre 60 et 30 jours avant le 1er jour de montage : 75 % du montant HT total.</p><p class="lp">— Moins de 30 jours avant le 1er jour de montage : 100 % du montant HT total. Dans tous les cas, les fabrications spécifiques et prestations déjà engagées restent dues intégralement.</p><p class="lp"><strong>7.5 Report ou annulation du salon</strong></p><p class="lp">En cas de report ou d'annulation à l'initiative du Client (abandon ou report de participation), les dispositions de l'article 7.4 s'appliquent. En cas de report ou d'annulation décidé par l'organisateur, S4U ne peut être tenu responsable des conséquences d'une telle décision. Les frais et prestations déjà engagés sont dus par le Client. S4U proposera, dans la mesure du possible, un report ou un avoir pour les prestations non encore engagées.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 8 — Propriété des biens et réserve de propriété</div><div class="cgv-art-body"><p class="lp"><strong>8.1 Biens loués</strong></p><p class="lp">Conformément à l'article 6, les biens mis à disposition dans le cadre d'une location demeurent la propriété exclusive de S4U à tout moment.</p><p class="lp"><strong>8.2 Biens vendus</strong></p><p class="lp">Dans le cadre d'une vente, la propriété des biens vendus n'est transférée qu'après complet paiement du prix, conformément aux articles 2367 et suivants du Code civil. Les risques de perte ou de détérioration sont néanmoins transférés au Client dès la livraison. En cas de procédure collective, le Client s'engage à informer immédiatement S4U afin de lui permettre d'exercer son droit de revendication.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 9 — Détérioration, sinistres et réclamations</div><div class="cgv-art-body"><p class="lp">Le Client est responsable de toute détérioration, perte, disparition, vol ou dégradation des biens mis à sa disposition, y compris du fait de ses salariés, prestataires, visiteurs, exposants voisins ou de tout tiers, pendant toute la durée de sa garde. En cas d'incident, il en informe S4U par écrit dans les vingt-quatre (24) heures suivant sa survenance.</p><p class="lp">Le Client s'engage à rembourser le coût de remplacement à neuf de tout élément manquant ou détérioré, ainsi que les frais de remise en état, de transport, de manutention et d'immobilisation éventuelle. Toute réclamation relative à la non-conformité des prestations doit être formulée par écrit dans les quarante-huit (48) heures suivant la réception. Passé ce délai, les prestations sont réputées acceptées sans réserve.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 10 — Responsabilité de S4U</div><div class="cgv-art-body"><p class="lp">La responsabilité de S4U est strictement limitée aux obligations expressément définies dans la commande acceptée. Elle ne saurait être engagée pour des dommages indirects ou consécutifs (perte de chiffre d'affaires, préjudice d'image, manque à gagner). Sauf faute lourde, faute dolosive ou disposition légale impérative contraire, la responsabilité totale de S4U est plafonnée au montant HT de la prestation ayant directement donné lieu à la réclamation.</p><p class="lp">S4U n'est pas responsable des décisions de l'organisateur du salon (refus d'accès, modification des surfaces, annulation), ni des contraintes techniques ou réglementaires du lieu dont elle n'aurait pas été informée. S4U est assurée en responsabilité civile professionnelle ; une attestation est disponible sur demande.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 11 — Confidentialité</div><div class="cgv-art-body"><p class="lp">Les parties traitent comme strictement confidentielles toutes les informations, documents et données techniques, tarifaires ou stratégiques échangés dans le cadre de leur relation. Cette obligation survit à l'extinction du contrat pour une durée de trois (3) ans.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 12 — Protection des données personnelles</div><div class="cgv-art-body"><p class="lp">Les données personnelles collectées (coordonnées du Client et de ses représentants) sont traitées par S4U en qualité de responsable de traitement, conformément au RGPD (règlement UE 2016/679) et à la loi n° 78-17 du 6 janvier 1978. Elles sont utilisées aux fins de gestion de la relation commerciale, d'exécution des contrats et, avec consentement, de prospection. Les données sont conservées pendant la durée strictement nécessaire à la relation commerciale et aux obligations légales applicables. Le Client dispose d'un droit d'accès, de rectification, d'effacement et d'opposition à exercer à contact@stand4you.com. En cas de réclamation, il peut saisir la CNIL (www.cnil.fr).</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 13 — Résiliation et manquement</div><div class="cgv-art-body"><p class="lp">En cas de manquement grave d'une partie non régularisé dans les quinze (15) jours suivant mise en demeure par lettre recommandée avec avis de réception, l'autre partie pourra résilier le contrat de plein droit, sans préjudice de tous dommages et intérêts. Constituent notamment un manquement grave du Client le non-paiement à échéance, l'utilisation abusive du matériel loué, la communication non autorisée des créations de S4U à des tiers.</p><p class="lp">En cas de résiliation aux torts du Client, les dispositions de l'article 7 relatives aux acomptes, annulations et prestations engagées demeurent intégralement applicables.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 14 — Droit applicable, juridiction et dispositions finales</div><div class="cgv-art-body"><p class="lp">Les présentes CGPLV sont régies par le droit français. Tout litige relatif à leur interprétation, leur exécution ou leur validité sera soumis à la compétence exclusive du Tribunal de Commerce de Nice, même en cas de demande incidente, d'appel en garantie, de procédure conservatoire ou de référé.</p><p class="lp">Si une clause était déclarée nulle, cette nullité n'affecterait pas les autres clauses, qui demeureront en vigueur. Le fait pour S4U de ne pas se prévaloir d'une disposition ne saurait valoir renonciation. Le Client fait élection de domicile à son siège social ou adresse professionnelle figurant dans le devis.</p></div></div>

es, floods, armed conflicts, riots, acts of terrorism, general or sector-specific strikes, pandemics or public health crises recognized by the competent authorities, administrative or prefectural decisions resulting in the cancellation, postponement or suspension of the event, major failure of a key supplier, raw material shortages, supply chain disruptions, unavailability of carriers or shortage of skilled labor.</p><p class="lp">S4U shall notify the Client in writing as soon as possible of the occurrence of such an event. In the event of a temporary suspension, performance of the contract shall be postponed for a period equivalent to the duration of the impediment, without compensation on either side. If the impediment continues or permanently prevents performance of the contract despite S4U's reasonable efforts, either party may terminate the contract by operation of law, without compensation or damages. In such a case, the deposits paid shall be retained to the extent of the studies, services, procurement, production, bookings, logistical costs and commitments already carried out or irrevocably entered into by S4U at the date the event occurred. Any remaining balance shall be returned to the Client.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 6 — Delivery, handover, custody and return</div><div class="cgv-art-body"><p class="lp">Unless expressly stated otherwise in the quotation, all materials, structures, furniture, equipment and installations provided by S4U are made available to the Client under a temporary rental arrangement for the duration of the relevant event and remain S4U's exclusive property at all times. This clause is enforceable against the Client, its creditors and any third party.</p><p class="lp">The goods are deemed to have been delivered, installed and to comply with the contractual specifications, unless the Client raises written, specific and reasoned reservations upon acceptance. In the absence of such reservations, delivery is deemed accepted without qualification and any subsequent claim relating to an apparent defect shall be inadmissible.</p><p class="lp">The transfer of custody and liability takes effect from installation at the place of performance until S4U's effective collection. During this period, the Client assumes custody of the goods within the meaning of Article 1242 of the French Civil Code. The Client must take out, at its own expense, any insurance covering its liability as tenant and operator both towards the public and regarding the equipment placed at its disposal. S4U reserves the right to require proof of insurance before the event begins.</p><p class="lp">The goods are non-transferable, cannot be seized by third parties, and may not be moved, modified, sub-let, pledged or incorporated into other elements without the prior written authorization of S4U. Upon return of the equipment, the Client is required to be present or represented. Failing this, the inspection report drawn up unilaterally by S4U shall constitute conclusive evidence. S4U has forty-eight (48) hours from the time of collection to draw up its condition report.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 7 — Financial terms</div><div class="cgv-art-body"><p class="lp"><strong>7.1 Pricing and invoicing</strong></p><p class="lp">All prices shown in quotations are expressed in euros exclusive of VAT. The applicable VAT rate is that in force on the date of issue of the invoice. Prices do not include trade fair registration fees, organizer taxes, electrical or utility connections, or parking and handling charges, unless expressly stated otherwise in the quotation. Invoices are payable immediately. In accordance with Article L441-10 of the French Commercial Code, no early payment discount will be granted.</p><p class="lp">The service is due and invoiced in full once assembly has been completed or the elements have been made available, including where the stand is not actually operated due to circumstances attributable to the Client or the organizer. Any additional travel is at the Client's expense.</p><p class="lp"><strong>7.2 Deposits and payment schedule</strong></p><p class="lp">A 70% deposit is payable upon order confirmation, unless otherwise indicated in the quotation. The balance is due upon acceptance of the works or no later than the first day of the exhibition. Different terms may be agreed in writing in the quotation. S4U will only proceed with performance upon receipt of the deposit payment.</p><p class="lp"><strong>7.3 Late payment penalties</strong></p><p class="lp">Any invoice not settled by its due date shall automatically, without prior notice, incur late payment penalties at a rate of three (3) times the statutory rate (Art. L.441-10 of the French Commercial Code), as well as a fixed recovery indemnity of €40 (Art. D.441-5 of the French Commercial Code).</p><p class="lp"><strong>7.4 Contract cancellation</strong></p><p class="lp">In the event of a material breach by the Client, S4U may, after a formal notice remaining without effect for eight (8) days, suspend ongoing services and/or repossess the rented materials, at the Client's cost, risk and peril. In the event of cancellation by the Client, the following fixed indemnities shall be owed to S4U, without prejudice to any additional damages:</p><p class="lp">— More than 60 days before the 1st installation day: the deposit paid is retained by S4U.</p><p class="lp">— Between 60 and 30 days before the 1st installation day: 75% of the total amount excluding VAT.</p><p class="lp">— Less than 30 days before the 1st installation day: 100% of the total amount excluding VAT. In all cases, specific fabrications and services already commenced remain due in full.</p><p class="lp"><strong>7.5 Postponement or cancellation of the exhibition</strong></p><p class="lp">In the event of postponement or cancellation at the Client's initiative, the provisions of Article 7.4 shall apply. In the event of postponement or cancellation decided by the organizer, S4U shall not be held liable for the consequences of such a decision. Costs and services already incurred are owed by the Client. S4U will, where possible, offer a postponement or credit for services not yet commenced.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 8 — Ownership of goods and retention of title</div><div class="cgv-art-body"><p class="lp"><strong>8.1 Rented goods</strong></p><p class="lp">In accordance with Article 6, goods made available under a rental arrangement remain the exclusive property of S4U at all times.</p><p class="lp"><strong>8.2 Sold goods</strong></p><p class="lp">In the context of a sale, title to the goods sold is not transferred until full payment of the price has been received, in accordance with Articles 2367 et seq. of the French Civil Code. The risk of loss or damage is nonetheless transferred to the Client upon delivery. In the event of insolvency proceedings, the Client undertakes to inform S4U immediately in order to enable it to exercise its right of recovery.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 9 — Damage, incidents and claims</div><div class="cgv-art-body"><p class="lp">The Client is liable for any deterioration, loss, disappearance, theft or damage to the goods placed at its disposal, including through the actions of its employees, service providers, visitors, neighboring exhibitors or any third party, throughout the period of its custody. In the event of an incident, the Client shall notify S4U in writing within twenty-four (24) hours of its occurrence.</p><p class="lp">The Client undertakes to reimburse the replacement cost at current new prices of any missing or damaged element, as well as the costs of restoration, transport, handling and any resulting downtime. Any claim relating to non-conformity of the services must be made in writing within forty-eight (48) hours of acceptance. After this period, the services are deemed accepted without reservation.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 10 — S4U's liability</div><div class="cgv-art-body"><p class="lp">S4U's liability is strictly limited to the obligations expressly defined in the accepted order. It shall not extend to indirect or consequential damages (loss of revenue, reputational harm, loss of profits). Except in cases of gross misconduct, fraudulent conduct or a mandatory statutory provision to the contrary, S4U's total liability is capped at the amount excluding VAT of the service that directly gave rise to the claim.</p><p class="lp">S4U is not responsible for decisions made by the exhibition organizer (denial of access, modification of surface areas, cancellation), nor for technical or regulatory constraints at the venue of which it was not informed. S4U carries professional liability insurance; a certificate is available on request.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 11 — Confidentiality</div><div class="cgv-art-body"><p class="lp">The parties shall treat as strictly confidential all information, documents and technical, commercial or strategic data exchanged in the context of their relationship. This obligation shall survive the termination of the contract for a period of three (3) years.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 12 — Personal data protection</div><div class="cgv-art-body"><p class="lp">Personal data collected (contact details of the Client and its representatives) are processed by S4U as data controller, in accordance with the GDPR (EU Regulation 2016/679) and French Law No. 78-17 of 6 January 1978. They are used for the purposes of managing the commercial relationship, performing contracts and, with consent, for prospecting. Data are retained for the period strictly necessary for the commercial relationship and applicable legal obligations. The Client has the right of access, rectification, erasure and objection, exercisable at contact@stand4you.com. In the event of a complaint, the Client may contact the CNIL (www.cnil.fr).</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 13 — Termination and breach</div><div class="cgv-art-body"><p class="lp">In the event of a serious breach by one party not remedied within fifteen (15) days following formal notice sent by recorded delivery letter with acknowledgement of receipt, the other party may terminate the contract by operation of law, without prejudice to all damages. The following shall in particular constitute a serious breach by the Client: non-payment when due, misuse of the rented equipment, unauthorized communication of S4U's creative works to third parties.</p><p class="lp">In the event of termination attributable to the Client, the provisions of Article 7 relating to deposits, cancellations and services already commenced shall remain fully applicable.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 14 — Governing law, jurisdiction and final provisions</div><div class="cgv-art-body"><p class="lp">These GTC are governed by French law. Any dispute relating to their interpretation, performance or validity shall be subject to the exclusive jurisdiction of the Commercial Court of Nice, including in the case of incidental claims, warranty claims, interim proceedings or emergency applications.</p><p class="lp">If any clause were to be declared void, such invalidity shall not affect the remaining clauses, which shall remain in force. Failure by S4U to enforce any provision shall not constitute a waiver thereof. The Client elects domicile at its registered office or professional address as set out in the quotation.</p></div></div>
`;

function checkAlerts(){
  const c=st.ctx;
  const isEn=st.lang==='en';
  const alerts=[];
  if(!c.cliSociete)alerts.push(isEn?'Client name missing':'Nom du client manquant');
  if(!c.cliAdresse)alerts.push(isEn?'Client address missing':'Adresse client manquante');
  if(!c.cliContact)alerts.push(isEn?'Client contact missing':'Contact client manquant');
  if(st.tvaMode!=='fr_na'&&st.tvaMode!=='export'&&st.tvaMode!=='eu_ht'&&!c.cliTVA)alerts.push(isEn?'VAT number missing':'N° de TVA client manquant');
  if(!c.salonNom)alerts.push(isEn?'Show/project name missing':'Nom du salon / projet manquant');
  if(!c.salonLieu)alerts.push(isEn?'Venue missing':'Lieu du salon manquant');
  if(!c.salonDates)alerts.push(isEn?'Show dates missing':'Dates du salon manquantes');
  return alerts;
}
function printD(){
  const alerts=checkAlerts();
  if(alerts.length){
    const msg=(st.lang==='en'?'Missing information:\n':'Informations manquantes\u00a0:\n')+alerts.map(a=>'• '+a).join('\n')+'\n\n'+(st.lang==='en'?'Generate PDF anyway?':'Générer le PDF quand même ?');
    if(!confirm(msg))return;
  }
  const win=window.open('','_blank','width=980,height=800,scrollbars=yes,resizable=yes');
  if(!win){alert(st.lang==='en'?'Please allow pop-ups.':'Veuillez autoriser les pop-ups.');return;}
  win.document.open();win.document.write(buildPDF());win.document.close();
}

(async()=>{
  /* Lit le type depuis l'URL (?type=s) avant de construire le catalogue */
  const params=new URLSearchParams(window.location.search);
  const recId=params.get('id');
  const typeParam=params.get('type');
  if(typeParam&&['n','r','s','m'].includes(typeParam))st.type=typeParam;
  await loadCatalogue();
  if(recId&&recId.startsWith('rec')){
    /* Sections viennent exclusivement d'atLoad (JSON ou champs Airtable) */
    render();
    await atLoad(recId);
  } else {
    /* Nouveau devis autonome : sections par défaut depuis le catalogue */
    st.sections=DEFS_IDX.map((ci,i)=>mkSec(ci,i));
    nSid=DEFS_IDX.length;
    render();
  }
})();
