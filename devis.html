.btn-sm{background:none;border:0.5px solid rgba(13,27,42,.2);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--sgray);font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.btn-sm:hover{border-color:var(--gold);color:var(--navy)}
.btn-sm.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-sm.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn-sm.gold:hover{background:#b8945a}

.devis-badge{font-size:11px;color:var(--sgray);background:#fff;border:0.5px solid rgba(13,27,42,.15);border-radius:5px;padding:4px 10px;font-family:'Cormorant Garamond',serif;font-style:italic}

/* ── AIRTABLE BANNER ── */
.at-banner{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;margin-bottom:10px;font-size:12px;font-family:'DM Sans',sans-serif}
.at-banner.loading{background:rgba(47,128,237,.08);border:0.5px solid rgba(47,128,237,.3);color:#1d6db8}
.at-banner.success{background:rgba(34,197,94,.08);border:0.5px solid rgba(34,197,94,.3);color:#166534}
.at-banner.error{background:rgba(239,68,68,.08);border:0.5px solid rgba(239,68,68,.3);color:#991b1b}
.at-banner.saving{background:rgba(201,169,110,.08);border:0.5px solid rgba(201,169,110,.3);color:#8a6a30}

@keyframes spin{to{transform:rotate(360deg)}}

/* ── CLIENT/SALON BLOCK ── */

.context-bar-left{display:flex;align-items:center;gap:10px}
.context-bar-title{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.context-summary{font-size:12px;color:var(--sgray);font-style:italic}
.context-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:14px}
.ctx-group h4{font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;padding-bottom:4px;border-bottom:0.5px solid rgba(201,169,110,.3)}
.ctx-field{margin-bottom:7px}
.ctx-field label{display:block;font-size:10px;color:var(--sgray);margin-bottom:3px;font-weight:500}
.ctx-field input,.ctx-field select{width:100%;font-size:12px;font-family:'DM Sans',sans-serif;border:0.5px solid rgba(13,27,42,.15);border-radius:5px;padding:5px 8px;color:var(--navy);background:#fff;outline:none}

.ctx-field input[readonly]{background:rgba(13,27,42,.03);color:var(--sgray)}
.ctx-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.at-src{font-size:9px;color:var(--gold);font-style:italic;margin-top:2px;display:flex;align-items:center;gap:3px}

/* ── TABS ── */
.tabs{display:flex;gap:0;margin-bottom:.75rem;border-bottom:2px solid var(--navy)}
.tab{padding:9px 16px;border:none;background:none;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--sgray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;letter-spacing:.02em;transition:color .15s}

.sh.open{border-bottom:0.5px solid rgba(13,27,42,.12)}

.ni{background:none;border:none;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:16px;color:#fff;outline:none;flex:1;min-width:0;padding:1px 0;letter-spacing:.02em}

.amt{width:110px;text-align:right;font-size:13px;border:0.5px solid rgba(13,27,42,.15);border-radius:6px;padding:5px 8px;font-family:'DM Sans',sans-serif;color:var(--navy)}

/* ═══ AIRTABLE API ═══ */
const AT_BASE=`https://api.airtable.com/v0/${BASE_ID}`;
const AT_HDR={'Authorization':`Bearer ${AT_TOKEN}`,'Content-Type':'application/json'};

async function atGet(table,recordId){
  const r=await fetch(`${AT_BASE}/${table}/${recordId}`,{headers:AT_HDR});
  if(!r.ok)throw new Error(`Airtable ${r.status}`);
  return(await r.json()).fields;
}
async function atPatch(table,recordId,fields){
  const r=await fetch(`${AT_BASE}/${table}/${recordId}`,{
    method:'PATCH',headers:AT_HDR,body:JSON.stringify({fields})
  });
  if(!r.ok)throw new Error(`Airtable ${r.status}`);
  return await r.json();
}
async function atFind(table,formula){
  const url=`${AT_BASE}/${table}?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`;
  const r=await fetch(url,{headers:AT_HDR});
  if(!r.ok)throw new Error(`Airtable ${r.status}`);
  const d=await r.json();
  return d.records&&d.records[0]?d.records[0]:null;
}

/* Chargement depuis Airtable via ?id=recXXX */
async function atLoad(recordId){
  showBanner('loading',t('atLoading'));
  try{
    const devis=await atGet(TBL_DEVIS,recordId);

    /* Restaure le JSON d'état si présent */
    if(devis.Devis_JSON){
      try{
        const saved=JSON.parse(devis.Devis_JSON);
        restoreState(saved);
        st.ctx._atRecordId=recordId;
        st._atMode=true;
        showBanner('success',t('atLoaded'));
        render();
        return;
      }catch(e){/* JSON corrompu → on initialise depuis les champs */}
    }

    /* Sinon initialise depuis les champs Airtable */
    st.ctx._atRecordId=recordId;
    st._atMode=true;
    st.ctx.num=devis.Fx_Numero||st.ctx.num;
    st.status=(devis.Statut||'Brouillon').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(devis.Surface_m2)st.ctx.salonSurface=String(devis['Surface_(m2)']||'');

    /* Charge le client lié — les champs linked retournent des record IDs */
    if(devis.CLIENT_Nom&&devis.CLIENT_Nom.length){
      const clientRecId=Array.isArray(devis.CLIENT_Nom)?devis.CLIENT_Nom[0]:devis.CLIENT_Nom;
      if(clientRecId.startsWith('rec')){
        const cf=await atGet(TBL_CLIENT,clientRecId);
        st.ctx.cliSociete=cf.Nom||'';
        st.ctx.cliContact=cf.Contact_Nom||'';
        st.ctx.cliEmail=cf.Email||'';
        st.ctx.cliAdresse=cf.Adresse||'';
        const nature=(cf.Nature_TVA||'fr').toLowerCase();
        st.ctx.cliNature=nature;
        uTVA(nature==='eu'?'eu':nature==='export'?'export':'fr');
        st.ctx._atClientId=clientRecId;
      }
    }

    /* Charge l'événement lié */
    if(devis.EVENEMENT&&devis.EVENEMENT.length){
      const evtRecId=Array.isArray(devis.EVENEMENT)?devis.EVENEMENT[0]:devis.EVENEMENT;
      if(evtRecId.startsWith('rec')){
        const ef=await atGet(TBL_EVNT,evtRecId);
        /* Nom du salon depuis le champ texte Fx_Nom ex: "SIMPPAR 2026" */
        st.ctx.salonNom=ef.Salon?(Array.isArray(ef.Salon)?ef.Salon[0]:ef.Salon):(ef.Fx_Nom||'');
        /* Dates */
        const d1=ef.Date_Debut?new Date(ef.Date_Debut).toLocaleDateString('fr-FR'):null;
        const d2=ef.Date_Fin?new Date(ef.Date_Fin).toLocaleDateString('fr-FR'):null;
        st.ctx.salonDates=d1&&d2?`${d1} – ${d2}`:d1||'';
        st.ctx._atEvtId=evtRecId;
        /* Lieu depuis la table Salon via record ID */
        if(ef.Salon&&ef.Salon.length){
          const salonRecId=Array.isArray(ef.Salon)?ef.Salon[0]:ef.Salon;
          if(salonRecId.startsWith('rec')){
            const sf=await atGet(TBL_SALON,salonRecId);
            st.ctx.salonNom=sf.Nom||st.ctx.salonNom;
            st.ctx.salonLieu=sf.Adresse||'';
          }
        }
      }
    }

    showBanner('success',t('atLoaded'));
    render();
  }catch(err){
    showBanner('error',t('atError')+err.message);
    render();
  }
}

/* Sauvegarde vers Airtable (debounce) */
let _saveTimer=null;
function scheduleSave(){
  if(!st._atMode||!st.ctx._atRecordId)return;
  const readonly=st.status==='accepte'||st.status==='refuse';
  if(readonly)return;
  clearTimeout(_saveTimer);
  setSavingDot(true);
  _saveTimer=setTimeout(()=>atSave(),2000);
}
async function atSave(){
  if(!st.ctx._atRecordId)return;
  showBanner('saving',t('atSaving'));
  try{
    const{ht,ap,ttc,acompte,solde}=calc();
    const statMap={brouillon:'Brouillon',envoye:'Envoyé',accepte:'Accepté',refuse:'Refusé'};
    await atPatch(TBL_DEVIS,st.ctx._atRecordId,{
      'Devis_JSON':JSON.stringify(st),
      'Montant_HT':Math.round(ht*100)/100,
      'Montant_TTC':Math.round(ttc*100)/100,
      'Acompte_HT':Math.round(acompte*100)/100,
      'Solde_HT':Math.round(solde*100)/100,
      'Statut':statMap[st.status]||'Brouillon',
      'Langue':st.lang
    });
    st.savedAt=new Date().toISOString();
    showBanner('success',t('atSaved'));
    setSavingDot(false);
    render();
  }catch(err){
    showBanner('error',t('atError')+err.message);
    setSavingDot(false);
  }
}

        montantHT:Math.round(ht*100)/100,
        montantTTC:Math.round(ttc*100)/100,

        solde:Math.round(solde*100)/100,
        tvaMode:st.tvaMode,

}

const LS_KEY='s4u_devis_list_v2';
const LS_CUR='s4u_devis_current_v2';
function lsGetList(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch{return[];}}
function lsSave(){
  const data=JSON.parse(JSON.stringify(st));
  data.savedAt=new Date().toISOString();
  const list=lsGetList();
  const idx=list.findIndex(d=>d.ctx.num===data.ctx.num);
  if(idx>-1)list[idx]=data;else list.unshift(data);
  localStorage.setItem(LS_KEY,JSON.stringify(list));
  localStorage.setItem(LS_CUR,data.ctx.num);
  st.savedAt=data.savedAt;
  showToast(t('atSavedLS'));
  render();
}
function lsLoad(num){
  const list=lsGetList();
  const data=list.find(d=>d.ctx&&d.ctx.num===num);
  if(!data)return false;
  restoreState(data);
  closeModal();render();return true;
}
function lsNew(){
  nSid=DEFS_IDX.length;nLid=300;
  st.type='n';
  st.sections=DEFS_IDX.map((ci,i)=>{const s=mkSec(ci,i);return s;});
  st.remise='0';st.rt='%';st.tvaMode='fr';st.acp='50';
  st.legal=JSON.parse(JSON.stringify(LEGAL_DEF));
  st.status='brouillon';st.savedAt=null;st._atMode=false;
  st.ctx={num:genDevisNum(),dateEmission:todayStr(),validite:'7',
    cliSociete:'',cliContact:'',cliEmail:'',cliAdresse:'',cliNature:'fr',
    salonNom:'',salonLieu:'',salonDates:'',salonSurface:'',ctxOpen:true,
    _atRecordId:null,_atClientId:null,_atEvtId:null};
  closeModal();render();
}
function restoreState(data){
  nLid=300;nSid=20;
  st.type=data.type||'n';st.remise=data.remise||'0';st.rt=data.rt||'%';
  st.tvaMode=data.tvaMode||'fr';st.acp=data.acp||'50';st.lang=data.lang||'fr';
  st.legal=data.legal||JSON.parse(JSON.stringify(LEGAL_DEF));
  st.ctx=Object.assign({ctxOpen:false,_atRecordId:null,_atClientId:null,_atEvtId:null},data.ctx);
  st.status=data.status||'brouillon';
  st.savedAt=data.savedAt||null;
  st._atMode=data._atMode||false;
  st.sections=data.sections.map(s=>{
    s.lines=(s.lines||[]).map(l=>{l.id=nLid++;if(l.storageType)dopen[l.id]=true;return l;});
    return s;
  });
}

/* ═══ UTILS ═══ */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function fmt(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+'\u00a0€';}
function effName(l){return l.custom?(l.ctxt||'Prestation'):(l.cat?dc(l.cat):'');}
function lineAmt(l){
  if(l.lineOff)return 0;
  if(l.storageType)return(parseFloat(l.qty)||0)*(parseFloat(l.uprice)||0);
  return parseFloat(l.lineHt)||0;
}
function calc(){
  const ht=st.sections.reduce((s,sec)=>{
    if(sec.phases)return s+sec.phases.reduce((p,ph)=>p+(ph.off?0:(parseFloat(ph.ht)||0)),0);
    if(sec.perLine)return s+sec.lines.reduce((p,l)=>p+lineAmt(l),0);
    return s+(sec.off?0:(parseFloat(sec.ht)||0));
  },0);
  const r=parseFloat(st.remise)||0;
  const rmt=st.rt==='%'?ht*r/100:Math.min(r,ht);
  const ap=Math.max(0,ht-rmt);
  const isFR=st.tvaMode==='fr';
  const tva=isFR?ap*0.2:0;
  const ttc=isFR?ap*1.2:ap;
  const pct=Math.max(0,Math.min(100,parseFloat(st.acp)||0));
  return{ht,rmt,ap,tva,ttc,acompte:ttc*pct/100,solde:ttc*(1-pct/100)};
}
function getLegal(){
  if(!st.legal[st.lang])st.legal[st.lang]=JSON.parse(JSON.stringify(LEGAL_DEF[st.lang]||LEGAL_DEF.fr));
  return st.legal[st.lang];
}
function updT(){
  const{ht,rmt,ap,tva,ttc,acompte,solde}=calc();
  const hr=(parseFloat(st.remise)||0)>0;
  const g=id=>document.getElementById(id);
  const sv=(id,v)=>{const e=g(id);if(e)e.textContent=v;};
  const sh=(id,vis)=>{const e=g(id);if(e)e.style.display=vis?'':'none';};
  sv('vht-s',fmt(ht));sv('vht-av',fmt(ht));
  sh('row-ht-s',!hr);sh('row-ht-av',hr);sh('row-ht-ap',hr);
  sv('vap',fmt(ap));sv('vrmt','− '+fmt(rmt));
  if(st.tvaMode==='fr'){sv('vtva',fmt(tva));sv('vttc',fmt(ttc));}
  sv('vacp',fmt(acompte));sv('vsol',fmt(solde));
  scheduleSave();
}
function updStoTotal(lid){
  const el=document.getElementById('sto-'+lid);if(!el)return;
  for(const s of st.sections){const l=s.lines&&s.lines.find(x=>x.id===lid);if(l){el.textContent=fmt(lineAmt(l));break;}}
}

function showToast(msg){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:20px;right:20px;background:#0D1B2A;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;font-family:DM Sans,sans-serif;z-index:9999;border-left:3px solid #C9A96E;box-shadow:0 4px 20px rgba(0,0,0,.2)';

/* ═══ RENDER ═══ */
function render(){
  const isNewStand=st.type==='n';
  const readonly=st.status==='accepte'||st.status==='refuse';
  const cgvPh=`<div class="cgv-ph"><strong style="font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--navy)">${t('cgvTitle')}</strong><br>${t('cgvPh')}</div>`;

  let body='';
  if(!isNewStand){
    body=`<p class="soon">${st.lang==='en'?'This type of quotation will be configured soon.':'Ce type de devis sera configuré prochainement.'}</p>`;
  } else {
    body=(readonly?`<div class="readonly-banner">🔒 ${t('readonlyNote')}<strong>${t('status'+st.status.charAt(0).toUpperCase()+st.status.slice(1))}</strong>${t('readonlyNote2')}</div>`:'')
      +st.sections.map((s,i)=>secHTML(s,i)).join('')
      +(readonly?'':addSelHTML())
      +totHTML()
      +legalBlock('nonInclus','nonInclusTitle')
      +legalBlock('conditions','condTitle')
      +legalBlock('propriete','propTitle')
      +cgvPh;
  }

  document.getElementById('app').innerHTML=
    headerHTML()
    +`<div class="tabs">${[{id:'n',k:'tabN'},{id:'r',k:'tabR'},{id:'s',k:'tabS'},{id:'m',k:'tabM'}].map(x=>`<button class="tab${st.type===x.id?' on':''}" onclick="sType('${x.id}')">${t(x.k)}</button>`).join('')}</div>`
    +ctxHTML()
    +body
    +bottomBarHTML();

  if(readonly){
    document.querySelectorAll('.ni,.amt,.asmall,.ri,.desc-ta,.legal-ta,.badd,.add-sel').forEach(el=>{
      el.disabled=true;el.style.opacity='.6';el.style.pointerEvents='none';
    });
  }
}

function togD(lid){dopen[lid]=!dopen[lid];render();}
function sType(ty){st.type=ty;render();}
function togO(id){const s=st.sections.find(s=>s.id===id);s.open=!s.open;render();}
function togOff(id){const s=st.sections.find(s=>s.id===id);s.off=!s.off;render();scheduleSave();}
function togPhOff(sid,gi){const s=st.sections.find(s=>s.id===sid);s.phases[gi].off=!s.phases[gi].off;render();scheduleSave();}
function uTVA(v){st.tvaMode=v;render();scheduleSave();}
function dSec(id){st.sections=st.sections.filter(s=>s.id!==id);render();scheduleSave();}
function aSec(v){if(v==='')return;const ci=parseInt(v);st.sections.push(isNaN(ci)||ci<0?{id:nSid++,ci:-1,name:'Nouvelle rubrique',open:true,lines:[],ht:'',off:false}:mkSec(ci));render();}
function aLine(sid){const s=st.sections.find(s=>s.id===sid);if(s)s.lines.push(mkLine({g:0}));render();}
function aLineTo(sid,gi){const s=st.sections.find(s=>s.id===sid);if(s)s.lines.push(mkLine({g:gi||0}));render();}
function aLinePerLine(sid){const s=st.sections.find(s=>s.id===sid);if(s)s.lines.push(mkLine({g:0}));render();}
function dLine(sid,lid){const s=st.sections.find(s=>s.id===sid);if(s)s.lines=s.lines.filter(l=>l.id!==lid);render();scheduleSave();}
function uName(id,v){const s=st.sections.find(s=>s.id===id);if(s)s.name=v;}
function uHT(id,v){const s=st.sections.find(s=>s.id===id);if(s){s.ht=v;updT();}}
function uPhHT(sid,gi,v){const s=st.sections.find(s=>s.id===sid);if(s&&s.phases){s.phases[gi].ht=v;updT();}}
function uDesc(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l)l.desc=v;}
function uCtxtLive(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l)l.ctxt=v;}
function confirmCat(sid,lid){
  const inp=document.getElementById('cinp-'+lid);
  const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);
  if(l){if(inp)l.ctxt=inp.value;l.confirmed=true;}
  render();
}
function uCatEdit(sid,lid){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.custom=true;l.ctxt=l.cat?dc(l.cat):(l.ctxt||'');l.confirmed=false;render();setTimeout(()=>{const inp=document.getElementById('cinp-'+lid);if(inp){inp.focus();inp.select();}},30);}}
function uCatReset(sid,lid){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.custom=false;l.cat='';l.confirmed=false;render();}}
function uLineHt(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.lineHt=v;updT();}}
function uLineOff(sid,lid){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.lineOff=!l.lineOff;render();scheduleSave();}}
function uLineQty(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.qty=v;updT();updStoTotal(lid);}}
function uLineUprice(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.uprice=v;updT();updStoTotal(lid);}}
function uLinePeriod(sid,lid,v){const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(l){l.period=v;render();scheduleSave();}}
function uCat(sid,lid,v){
  const s=st.sections.find(s=>s.id===sid);const l=s&&s.lines.find(l=>l.id===lid);if(!l)return;
  if(v==='Autre'){l.custom=true;l.cat='';l.ctxt='';l.confirmed=false;render();setTimeout(()=>{const inp=document.getElementById('cinp-'+lid);if(inp)inp.focus();},30);return;}
  l.custom=false;l.cat=v;l.confirmed=false;
  if(s.perLine){const wasSto=l.storageType;l.storageType=(v==='Frais de stockage');if(l.storageType&&!wasSto){l.desc='payable à terme à échoir';dopen[l.id]=true;}}
  if(s.ci===0)for(let gi=0;gi<SC[0].groups.length;gi++){if(SC[0].groups[gi].cats.includes(v)){l.g=gi;break;}}
  render();
}
function uRem(v){st.remise=v;updT();}
function togRT(){st.rt=st.rt==='%'?'€':'%';render();}
function uAcp(v){st.acp=v;updT();}
function togLang(){st.lang=st.lang==='fr'?'en':'fr';render();}
function togLegal(key){if(lEdit[key]){const ta=document.querySelector(`[data-lkey="${key}"]`);if(ta)getLegal()[key]=ta.value;}lEdit[key]=!lEdit[key];render();}
function togCtx(){st.ctx.ctxOpen=!st.ctx.ctxOpen;render();}
function uCtx(k,v){st.ctx[k]=v;}
function uStatus(v){
  const wasTerminal=st.status==='accepte'||st.status==='refuse';
  const becomesTerminal=v==='accepte'||v==='refuse';
  if(wasTerminal&&!becomesTerminal){
    if(!confirm(st.lang==='fr'?'Réouvrir ce devis en modification ?':'Reopen this quote for editing?'))return;
  }
  st.status=v;
  /* Sauvegarde immédiate sur changement de statut */
  if(st._atMode&&st.ctx._atRecordId){
    clearTimeout(_saveTimer);
    atSave().then(()=>{
      /* Si accepté → déclenche webhook Make */
      if(v==='accepte'){
        showToast(t('accepteWebhook'));
        triggerMake();
      }
    });
  } else {
    lsSave();
  }
  render();
}

  const lg=getLegal();

  const SVG_PDF=`<svg width="36" height="36" viewBox="0 0 100 115" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="50,0 100,28.75 100,57.5 50,28.75" fill="#C1A36F"/><polygon points="50,0 0,28.75 0,57.5 50,28.75" fill="#A79162"/><polygon points="0,57.5 50,28.75 50,86.25 0,86.25" fill="#F4F5F0"/><polygon points="100,57.5 50,28.75 50,86.25 100,86.25" fill="#0D1B2A"/><polygon points="0,86.25 50,86.25 50,115 0,115" fill="#CDD0C9"/><polygon points="100,86.25 50,86.25 50,115 100,115" fill="#1281AE"/></svg>`;

  const rows=st.sections.map((s,idx)=>{

      let h=`<tr class="sr"><td class="cn">${idx+1}</td><td colspan="2" class="cm">${esc(nm)}</td></tr>`;

        const lbl=ds(g.lbl);const gl=s.lines.filter(l=>(l.g||0)===gi&&effName(l));

        h+=`<tr class="par"><td></td><td class="cpl">${t('mHT')} ${lbl}</td>${ac}</tr>`;
      }return h;

      h+=s.lines.filter(l=>effName(l)).map(l=>{
        let amtStr='';
        if(l.storageType){const tot=lineAmt(l);amtStr=l.lineOff?`<span class="bo">${t('offBadge')}</span>`:fmt(tot)+`&nbsp;<span style="font-size:9px;color:#9ca3af">(${l.qty||0}\u00a0×\u00a0${fmt(parseFloat(l.uprice)||0)}\u00a0/\u00a0${l.period})</span>`;}
        else{amtStr=l.lineOff?`<span style="text-decoration:line-through;opacity:.4">${fmt(l.lineHt||0)}</span>&nbsp;<span class="bo">${t('offBadge')}</span>`:fmt(l.lineHt||0);}

</div>
<div class="cgv-art"><div class="cgv-art-title">Article 1 — Champ d'application et opposabilité</div><div class="cgv-art-body"><p>Les présentes Conditions Générales de Prestations, Location et Vente (ci-après « CGPLV ») régissent l'ensemble des relations commerciales entre Stand 4 You (ci-après « S4U »), société par actions simplifiée au capital de 5 000 €, immatriculée au RCS de Nice sous le numéro 102 806 783, et tout client professionnel (ci-après « le Client ») passant commande auprès de S4U, quelle que soit la nature de la prestation : conception, fabrication, montage, location, vente ou démontage de stands et espaces d'exposition.</p><p>Les CGPLV sont remises au Client préalablement à toute commande, notamment en annexe du devis. Leur acceptation est réputée acquise dès la signature du devis par le Client, laquelle vaut acceptation expresse et sans réserve des présentes conditions. Toute clause contraire figurant dans un document du Client est inopposable à S4U, sauf accord écrit et signé par S4U.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 2 — Formation du contrat</div><div class="cgv-art-body"><p>Toute commande est précédée d'un devis détaillé, valable trente (30) jours calendaires à compter de sa date d'émission, sauf mention contraire. Le contrat est formé à la réception par S4U du devis signé par le Client, accompagné du règlement de l'acompte défini à l'article 7.2. Toute modification ultérieure de la commande doit faire l'objet d'un avenant écrit signé par les deux parties.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 3 — Propriété intellectuelle</div><div class="cgv-art-body"><p>Les plans, études, esquisses, maquettes, perspectives 3D, fichiers numériques, cahiers des charges, calques, visuels et tout autre document ou création réalisés par S4U dans le cadre de sa mission sont et demeurent la propriété exclusive de S4U, même lorsqu'ils ont été produits à la demande ou aux frais du Client. Leur reproduction, transmission, exploitation ou divulgation à des tiers sont strictement interdites sans l'accord écrit préalable de S4U. En cas de commande ferme et de règlement intégral du prix, S4U concède au Client une licence d'utilisation non exclusive, limitée à l'usage du stand objet de la commande.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 4 — Exécution, sous-traitance, délais et force majeure</div><div class="cgv-art-body"><p>4.1  Exécution et sous-traitance</p><p>S4U s'engage à exécuter les prestations commandées avec le soin, la diligence et le professionnalisme attendus d'un opérateur de son secteur. S4U se réserve le droit de recourir à des sous-traitants pour tout ou partie des prestations, sous sa responsabilité et sans que cela n'affecte les obligations envers le Client.</p><p>Les matériaux et structures livrés par S4U sont conformes à la réglementation en vigueur à la date de l'événement. S4U se réserve le droit de procéder à des adaptations techniques mineures sans en informer préalablement le Client, dès lors que ces adaptations n'affectent pas l'esthétique ni les fonctionnalités du stand.</p><p>4.2  Délais</p><p>Les délais d'exécution courent à compter de la réception simultanée du devis signé, de l'acompte exigible et de l'ensemble des éléments nécessaires à l'exécution (brief, visuels, plans, accréditations salon, etc.). S4U ne saurait être tenue responsable d'un retard imputable à une transmission tardive de ces éléments par le Client ou par l'organisateur du salon.</p><p>4.3  Force majeure</p><p>S4U ne saurait être tenue responsable d'un retard ou d'une inexécution résultant d'un cas de force majeure au sens de l'article 1218 du Code civil, notamment : catastrophes naturelles, grèves générales, conflits armés, décisions administratives ou gouvernementales, pandémies, ou tout événement imprévisible et irrésistible rendant impossible l'exécution de ses obligations. S4U informera le Client dès que possible et les parties se concerteront de bonne foi sur les suites à donner.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 5 — Réception, garde, détérioration et réclamations</div><div class="cgv-art-body"><p>Sauf cas de force majeure, S4U garantit au Client la jouissance normale du matériel et des équipements fournis et installés, conformément aux spécifications du devis accepté.</p><p>Le transfert de responsabilité intervient à compter du dépôt ou de l'installation sur les lieux d'exécution ; à partir de ce moment, le Client est réputé avoir pris possession du matériel et en assume la garde.</p><p>Le Client est responsable de toute détérioration, perte ou disparition de matériaux ou équipements mis à sa disposition, survenant entre la prise de possession et la restitution à S4U. Toute réclamation relative à l'exécution des prestations doit être formulée par écrit dans un délai de quarante-huit (48) heures suivant la constatation du problème.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 6 — Réserve de propriété</div><div class="cgv-art-body"><p>En location : l'ensemble des matériaux, structures modulaires, mobiliers et équipements fournis par S4U demeurent, à tout moment, la propriété exclusive de S4U. Le Client dispose d'un droit d'usage limité à la durée et à l'objet définis dans le devis accepté.</p><p>En vente : la propriété des marchandises ne sera transférée au Client qu'après complet paiement du prix, en principal, frais et taxes, nonobstant la livraison et la prise de possession.</p><p>Dans les deux cas, le Client s'interdit de transformer, nantir, céder, louer, prêter, déplacer, donner en gage ou laisser saisir les biens fournis par S4U sans son accord écrit préalable.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 7 — Conditions financières</div><div class="cgv-art-body"><p>7.1  Tarifs</p><p>Tous les prix figurant dans les devis sont exprimés en euros hors taxes (HT). La TVA applicable est celle en vigueur à la date de facturation. S4U se réserve le droit de réviser ses tarifs à tout moment ; les prestations commandées sont toutefois facturées au prix figurant dans le devis accepté.</p><p>7.2  Acomptes et échéances</p><p>Un acompte est exigible à la confirmation de commande ; son montant est défini dans le devis. Le solde est exigible à la livraison ou à la première journée d'ouverture du salon, sauf modalités différentes expressément prévues dans le devis.</p><p>7.3  Pénalités de retard et défaillance</p><p>Toute facture non réglée à son échéance porte de plein droit, sans mise en demeure préalable, des pénalités de retard calculées au taux de trois (3) fois le taux d'intérêt légal en vigueur, ainsi qu'une indemnité forfaitaire de recouvrement de quarante (40) euros conformément à l'article D. 441-5 du Code de commerce. En cas de défaillance de paiement, S4U se réserve le droit de suspendre ou d'interrompre l'exécution de la prestation en cours sans que cela puisse engager sa responsabilité.</p><p>7.4  Annulation par le Client</p><p>En cas d'annulation de la commande par le Client, les indemnités forfaitaires suivantes sont dues à S4U, sans préjudice de tout autre dommage subi :</p><p>Annulation après versement de l'acompte et plus de 60 jours ouvrés avant le premier jour de montage : l'acompte versé reste acquis à S4U à titre d'indemnité.</p><p>Annulation entre 60 et 30 jours ouvrés avant le premier jour de montage : 75 % du montant HT total.</p><p>Annulation à moins de 30 jours ouvrés avant le premier jour de montage : 100 % du montant HT total.</p><p>Dans tous les cas, les fabrications spécifiques, commandes de matériaux et prestations déjà engagées au moment de l'annulation sont dues intégralement par le Client.</p><p>7.5  Report ou annulation du salon</p><p>Report ou annulation à l'initiative du Client (abandon ou report de sa participation) : les dispositions de l'article 7.4 s'appliquent.</p><p>Annulation ou report de l'événement décidé par l'organisateur : S4U ne peut être tenue responsable des conséquences d'une telle décision. Les frais et prestations déjà engagés par S4U sont dus par le Client. S4U proposera, dans la mesure du possible, un report ou un avoir pour les prestations non encore engagées.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 8 — Responsabilité de S4U</div><div class="cgv-art-body"><p>La responsabilité de S4U est strictement limitée aux obligations expressément définies dans la commande acceptée. Elle ne saurait être engagée pour des dommages indirects, immatériels ou consécutifs subis par le Client (perte de chiffre d'affaires, manque à gagner, préjudice d'image, etc.). En tout état de cause, la responsabilité totale de S4U au titre d'une commande est plafonnée au montant HT de ladite commande.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 9 — Confidentialité et données personnelles</div><div class="cgv-art-body"><p>Les parties s'engagent mutuellement à traiter comme strictement confidentielles toutes les informations, documents, données techniques, commerciales ou stratégiques échangés dans le cadre de leur relation, et à ne pas les divulguer à des tiers sans accord écrit préalable. Cet engagement de confidentialité s'applique pendant toute la durée de la relation contractuelle et durant trois (3) ans après son terme.</p><p>Les données personnelles collectées dans le cadre de la relation commerciale (coordonnées du Client, de son représentant légal et de ses contacts) sont traitées par S4U en qualité de responsable de traitement, conformément au Règlement Général sur la Protection des Données (RGPD) et à la loi Informatique et Libertés. Ces données sont utilisées aux seules fins d'exécution du contrat, de gestion de la relation client et, avec le consentement du Client, de prospection commerciale. Elles ne sont pas cédées à des tiers. Le Client dispose d'un droit d'accès, de rectification, d'effacement et de portabilité de ses données, qu'il peut exercer à l'adresse contact@stand4you.com.</p></div></div>
<div class="cgv-art"><div class="cgv-art-title">Article 10 — Résiliation, droit applicable et dispositions finales</div><div class="cgv-art-body"><p>En cas de manquement grave d'une partie à ses obligations contractuelles, non régularisé dans un délai de quinze (15) jours suivant mise en demeure par lettre recommandée avec avis de réception, l'autre partie pourra résilier le contrat de plein droit, sans préjudice de tout dommage et intérêt.</p><p>Les présentes CGPLV sont régies par le droit français. Tout litige relatif à leur interprétation, leur exécution ou leur validité sera soumis, à défaut de règlement amiable, à la compétence exclusive du Tribunal de Commerce de Nice, même en cas de pluralité de défendeurs ou d'appel en garantie. Le Client professionnel renonce expressément à se prévaloir de la compétence de toute autre juridiction.</p></div></div>

  } else {
    /* Mode local — charge le dernier devis du localStorage */
    try{const cur=localStorage.getItem(LS_CUR);if(cur&&!lsLoad(cur))render();}catch{render();}
    render();
  }
})();
</script>
</body>
